name: Deploy beide Apps zu GitHub Pages

on:
  push:
    branches: ["claude/wonderful-cray-kUoP4"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/wonderful-cray-kUoP4

      - name: Build combined deployment
        run: |
          mkdir -p dist
          # Übersichtsseite → Root
          cp portal-index.html dist/index.html
          # LinguaFlow → /linguaflow/
          mkdir -p dist/linguaflow
          cp -r trainer/. dist/linguaflow/
          # ServicePortal → /techniker/
          mkdir -p dist/techniker
          cp index.html dist/techniker/
          cp sw.js dist/techniker/
          cp -r css dist/techniker/
          cp -r js dist/techniker/
          cp -r data dist/techniker/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist/"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
